# kyctrl — AI Maintainer Assistant configuration
#
# This file is the single source of truth for the agent's behavior in this
# repository. It is read remotely at the start of every run (never cached
# across runs). Any maintainer can change it without touching agent code.
#
# Two independent kill switches exist on purpose:
#   1. `enabled: false` below — a reviewed, auditable change (requires a PR).
#   2. The `AI_MAINTAINER_ENABLED` repository Actions variable — instant,
#      no PR needed, for "stop everything right now" emergencies. The repo
#      variable always wins if the two disagree.

enabled: true

# Per-workflow kill switches. A workflow only runs if BOTH this is true
# and the top-level `enabled` / repo variable are true.
workflows:
  dependabot_auto_merge: true
  pr_hygiene: false        # stretch goal, off by default in the prototype
  issue_triage: true
  codegen_gate: false      # narrative-only in the prototype, not implemented yet
  # Dimension 2 (multi-agent system) + Slack/Discussions Q&A — all off by
  # default until their infra (Neo4j, Slack app credentials) is wired up in
  # a given deployment; see README and docs/TESTING.md.
  qa_assistant: true
  pattern_agent: true
  coach_agent: false
  security_agent: false
  reproduction_agent: false

# Rate limiting — max actions per hour, per workflow. Prevents runaway
# behavior in all edge cases (e.g. a webhook replay storm).
rate_limits:
  dependabot_auto_merge: 10
  issue_triage: 20
  qa_assistant: 20
  coach_agent: 15
  security_agent: 10
  pattern_agent: 1
  reproduction_agent: 5

dependabot:
  # patch_and_minor | patch_only | none
  auto_merge: patch_and_minor
  # Only PRs opened by these bot accounts enter this workflow at all.
  bot_usernames:
    - "dependabot[bot]"
    - "renovate[bot]"
    - "suhaani-agarwal"
  # Packages that always require a human, regardless of semver bump —
  # security-sensitive or historically fragile dependencies.
  excluded_packages:
    - github.com/sigstore/cosign
    - github.com/sigstore/rekor
    - github.com/notaryproject/notation-go
    - k8s.io/client-go
  # PR must be at least this old before auto-merge is eligible, so a
  # just-opened PR can't be merged before CI has even had a chance to run.
  min_pr_age_minutes: 5
  # A human-applied label that blocks auto-merge no matter what the rule
  # engine says.
  hold_label: hold
  # Label applied when the rule engine defers to a human.
  needs_review_label: needs-human-review
  # Required GitHub check names that must all be green before merging.
  # Empty list = "all checks reported for the PR must be green".
  required_checks: []
  # Query OSV.dev (https://osv.dev — free, open source, no API key) for
  # known vulnerabilities in the exact new version of every dependency in
  # the PR before merging. Only runs for PRs where Dependabot's commit
  # trailer parsed (see merge_policy.py's resolve_bump()/parse_pr_dependency_updates()) —
  # it needs the per-package new version that trailer provides.
  osv_check_enabled: true

issue_triage:
  # Real Kyverno label taxonomy (see .github/labels.yml and
  # .github/ISSUE_TEMPLATE/*.yaml in kyverno/kyverno — NOT invented for
  # this prototype). Kyverno disables blank issues; every issue already
  # arrives pre-labeled by its template ("bug"+"triage", "bug"+"type:cli"
  # +"triage", or "enhancement"+"triage"). The agent's job is mostly to
  # move the issue past `triage`, not to invent a label from nothing.
  labels:
    bug: bug
    cli_bug: type:cli
    feature: enhancement
    security: security
    triage: triage
  # Real field ids from .github/ISSUE_TEMPLATE/bug-{other,cli,webhook}.yaml.
  # Kyverno's bug templates do NOT have separate "policy YAML" / "resource
  # YAML" fields — reporters paste manifests inline inside
  # `bug-reproduce-steps`. So "missing info" is a content check on that
  # field (does it contain a fenced YAML block with `apiVersion`/`kind`?),
  # not a check for a field that doesn't exist. See
  # skills/kyverno/issue-triage.md for the exact heuristic.
  required_bug_fields:
    - kyverno-version
    - bug-description
    - bug-reproduce-steps
    - bug-expectations
  # k8s-version and k8s-platform only exist on the webhook template.
  webhook_only_fields:
    - k8s-version
    - k8s-platform
  # Labels that always suppress bot activity on an issue, regardless of
  # what the FSM or classifier would otherwise do. `security` is included
  # so Triage never touches a vulnerability report — that's exclusively
  # security_agent.py's concern (see below), and the two must never race on
  # the same issue.
  exclusion_labels:
    - do-not-triage
    - long-term
    - security

# Paths the agent may touch autonomously vs. paths that always require a
# human. See skills/kyverno/safe-boundaries.md for the full reasoning.
safe_boundaries:
  restricted_paths:
    - api/kyverno/v1/
    - pkg/cosign/
    - pkg/notary/
  autonomous_paths:
    - "**/go.mod"
    - "**/go.sum"
    - config/crds/

# Dimension 2 multi-agent policies + the Slack/Discussions Q&A assistant.
# See docs/kyctrl_extra_features.md Dimension 2 and skills/kyverno/*.md for
# each agent's grounding.
qa_assistant:
  # Minimum self-reported confidence required before the agent posts an
  # answer publicly. Below this, it escalates to a maintainer instead of
  # guessing — never lowered casually, this is the "never guess" guarantee.
  # Temporarily "medium" for local demo/testing (was "high") — a well-cited
  # medium-confidence answer (e.g. covers concepts/requirements but the
  # retrieved chunks didn't include literal command syntax) is worth seeing
  # during testing rather than every borderline case escalating. Raise back
  # to "high" before any real deployment.
  confidence_threshold: medium
  max_search_results: 5
  default_kyverno_version: latest
  slack_channels:
    - kyverno
  discussion_categories:
    - "Q&A"
    - General
  escalation:
    slack_channel: kyverno-maintainers
    # Filled in by a real maintainer at deploy time — deliberately left
    # empty here rather than inventing GitHub usernames.
    github_maintainer_logins: []

pattern_agent:
  lookback_days: 7
  min_cluster_size: 2

coach_agent:
  exclude_bot_authors: true

security_agent:
  trigger_labels:
    - security
  private_slack_channel: kyverno-security-private

reproduction_agent:
  workflow_file: reproduce-issue.yaml

# Dimension 3 — Graphiti temporal memory. See docs/kyctrl_extra_features.md
# Dimension 3 and src/memory.py. Off by default, same convention as the
# Dimension 2 policies above — but "wired up" here is lighter than it looks:
# this reuses the neo4j service and VOYAGE_API_KEY/ANTHROPIC_API_KEY already
# required for the Q&A assistant's doc graph, not new infrastructure.
memory:
  enabled: true
  # How many facts a prefetch/search_memory call returns by default.
  search_top_k: 5
